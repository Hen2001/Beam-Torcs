name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libglib2.0-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          freeglut3-dev \
          libplib-dev \
          libopenal-dev \
          libalut-dev \
          libxi-dev \
          libxmu-dev \
          libxrender-dev \
          libxrandr-dev \
          libpng-dev \
          libjpeg-dev \
          libfreetype6-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          uuid-dev \
          libpulse-dev \
          zlib1g-dev \
          libxft-dev \
          libxext-dev \
          libxxf86vm-dev \
          libvorbis-dev \
          libtinyxml-dev \
          libglew-dev \
          libspdlog-dev \
          cmake \
          qtbase5-dev \
          qtchooser \
          qt5-qmake \
          qtbase5-dev-tools \
          libqt5opengl5-dev \
          libpng++-dev \
          x11proto-core-dev \
          libx11-dev
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
